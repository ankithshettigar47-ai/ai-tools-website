<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Social Media Command Center</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>🚀 CEO Social Media Command Center</h1>
            <div class="user-info">
                <span>Welcome, CEO</span>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="research">🔍 Research Dept</button>
            <button class="tab-btn" data-tab="content">🎬 Content Creation</button>
            <button class="tab-btn" data-tab="approval">✅ Approval Queue</button>
            <button class="tab-btn" data-tab="analytics">📊 Analytics</button>
            <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
        </nav>

        <main>
            <!-- Research Department -->
            <section id="research" class="tab-content active">
                <h2>Research Department - Trend Analysis</h2>
                <div class="controls">
                    <button id="scanTrends" class="btn-primary">Scan Latest Trends</button>
                    <button id="analyzeCompetitors" class="btn-primary">Analyze Competitors</button>
                </div>
                <div id="trendingTopics" class="grid-container"></div>
                <div id="competitorAnalysis" class="grid-container"></div>
            </section>

            <!-- Content Creation -->
            <section id="content" class="tab-content">
                <h2>Content Creation Department</h2>
                <div class="controls">
                    <button id="generateVideo" class="btn-primary">Generate Video from Trends</button>
                    <button id="generateStory" class="btn-primary">Generate Story Content</button>
                    <button id="autoCreate" class="btn-success">Auto-Create Full Campaign</button>
                </div>
                <div id="contentQueue" class="content-list"></div>
            </section>

            <!-- Approval Queue -->
            <section id="approval" class="tab-content">
                <h2>Approval Queue - Ready for CEO Review</h2>
                <div id="approvalQueue" class="approval-list"></div>
            </section>

            <!-- Analytics -->
            <section id="analytics" class="tab-content">
                <h2>Performance Analytics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Posts</h3>
                        <p id="totalPosts">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Likes</h3>
                        <p id="totalLikes">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Followers</h3>
                        <p id="totalFollowers">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Engagement Rate</h3>
                        <p id="engagementRate">0%</p>
                    </div>
                </div>
                <div id="performanceChart" class="chart-container"></div>
            </section>

            <!-- Settings -->
            <section id="settings" class="tab-content">
                <h2>Account Settings</h2>
                <div class="settings-form">
                    <div class="form-group">
                        <label>Instagram Username</label>
                        <input type="text" id="instagramUsername" placeholder="@yourusername">
                    </div>
                    <div class="form-group">
                        <label>Auto-Upload Threshold (Likes)</label>
                        <input type="number" id="autoUploadThreshold" value="1000">
                    </div>
                    <div class="form-group">
                        <label>Content Categories</label>
                        <select id="contentCategories" multiple>
                            <option value="tech">Technology</option>
                            <option value="lifestyle">Lifestyle</option>
                            <option value="business">Business</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="education">Education</option>
                        </select>
                    </div>
                    <button id="saveSettings" class="btn-primary">Save Settings</button>
                </div>
            </section>
        </main>

        <!-- Modal for Video Preview -->
        <div id="videoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Video Preview</h2>
                <div id="modalVideo" class="video-preview"></div>
                <p id="modalDescription"></p>
                <div class="modal-actions">
                    <button id="approveVideo" class="btn-success">Approve & Upload to Instagram</button>
                    <button id="rejectVideo" class="btn-danger">Reject</button>
                    <button id="requestChanges" class="btn-secondary">Request Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/research.js"></script>
    <script src="js/content.js"></script>
    <script src="js/approval.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
